name: Security Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      dast_target_url:
        description: "Optional URL for DAST scanning with OWASP ZAP"
        required: false
        type: string

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"
  DAST_TARGET_URL: ${{ inputs.dast_target_url || vars.DAST_TARGET_URL }}

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

      - name: Compile Python sources
        run: find lambdas -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile

  sast:
    name: SAST and IaC Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit checkov

      - name: Run Bandit
        run: bandit -r ./lambdas

      - name: Run Checkov
        run: checkov -d . --skip-path .terraform --skip-path .venv --skip-path security-reports

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: .terraform,.venv,security-reports
          format: table
          exit-code: "1"
          ignore-unfixed: true

  dast:
    name: DAST
    runs-on: ubuntu-latest
    if: ${{ env.DAST_TARGET_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          fail_action: true
          allow_issue_writing: false

